name: Helldivers Major Order Tracker

on:
  schedule:
    # 国际标准时间 00:00 与 12:00（即北京时间 08:00 与 20:00，刚好间隔 12 小时）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发测试

jobs:
  check-orders:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许工作流向仓库推送 json 状态变更

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests deep-translator

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_major_order.py

      - name: Commit & Push State Change
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/helldivers_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update helldivers major order state" && git push)
